positional_encoding_min_inclusive: -4
positional_encoding_max_inclusive: 5

number_of_classes: 12 # Maximum number of classes in a scene, as long as it is larger than the number of segments in your scene, you are fine.

loss_type: occ+sdf # Options: occ, sdf, occ+sdf, occ+sdf+cos

architecture: pointnet++
run_type: train #Options: train, test, nrrd, single
dataset_prefix_path: /tmp/ludo_example/stanford_bunny/
scene: bunny # Add in actual scene config
learning_rate: 0.0005
learning_rate_decay: True
clamp_distance: .inf
epochs: 700
batch_size: 40
dropout: 0.0
hidden_layers_in_mlp: 8

nrrd_resolution: [400, 400, 400]
nrrd_range: [0, 49] #inclusive range
nrrd_resolution_test: [300, 300, 300]
nrrd_resolution_train: [200, 200, 200]
occupancy_pcd_resolution: 40000
explainability_pcd_resolution: 10000

log_accuracy_period: 10
log_iou_period: 20
log_model_period: 100
log_model_path: trained_stanford_bunny

augment_rotation: False
augment_rotation_degrees: 30
augment_mirror: False
augment_maximum_drop_point_probability: 0.7

force_reprocess: False
